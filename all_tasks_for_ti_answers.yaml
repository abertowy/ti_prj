# zuul.d/projects.yaml
- job:
    name: project-build-and-upload
    description: |
      Base job for manual builds
      Maintainer: Dev Team (dev@example.com)
    pre-run:
      - playbooks/pre/main.yaml
    run:
      - playbooks/run/main.yaml
    post-run:
      - playbooks/post/main.yaml
    vars:
      project_path: /some_path/project
      project_name: HybridEngineTest
      artifacts_path: /some_path/artifacts
      pkg_name: pkg-release.tar.gz
      upload_target: true

######################################
# playbooks/pre/main.yaml
- name: Prepare environment for build process
  hosts: all

  tasks:
    - name: set pre-run action
      set_fact:
        pre_run_action: prepare

######################################
# playbooks/run/main.yaml
- name: Build project
  hosts: all

  tasks:
    - name: set run action
      set_fact:
        run_action: build

    - include_role:
        name: build-project
      vars:
        project_dir: "{{ project_path }}"
        project: "{{ project_name }}"
        pkg: "{{ pkg_name }}"

######################################
# roles/build-project/tasks/main.yaml
- include_tasks: windows.yaml
  when: ansible_os_family == "Windows"

- include_tasks: linux.yaml
  when: ansible_os_family != "Windows"

######################################
# roles/build-project/tasks/windows.yaml
- name: Create CMakeLists for build
  win_shell: "python createMakefile.py --src-path src --project {{ HybridEngineTest }}"
  register: create_cmakelists
  change_dir: "{{ project_dir }}"

- name: Build project via CMake
  win_shell: |
    cmake -S . -B build
    cmake --build build
  register: build_project_cmake
  change_dir: "{{ project_dir }}"

######################################
# roles/build-project/tasks/linux.yaml
- name: Create CMakeLists for build
  shell: "python createMakefile.py --src-path src --project {{ HybridEngineTest }}"
  register: create_cmakelists
  change_dir: "{{ project_dir }}"

- name: Build project via CMake
  shell: |
    cmake -S . -B build
    cmake --build build
  register: build_project_cmake
  change_dir: "{{ project_dir }}"

######################################
# playbooks/post/main.yaml
- name: Upload build artifacts
  hosts: all

  tasks:
    - name: set post-run action
      set_fact:
        post_run_action: upload

    - name: compress all the files in tar.gz
      archive:
        path: "{{ project_path }}/build/{{ project_name }}"
        dest: "{{ artifacts_path }}/{{ pkg_name }}"
        format: gz

